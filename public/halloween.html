<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Haunted Halloween</title>
  <style>
    /* CSS goes here */
    body {
  margin: 0;
  height: 100vh;
  background: linear-gradient(135deg, #4b004b, #ff6f00);
  background-size: 400% 400%;
  animation: aurora 20s ease infinite;
  font-family: Arial, sans-serif;
  color: #ffcc00;
  text-align: center;
  overflow: hidden;
}

/* Animate background gradient slowly */
@keyframes aurora {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* Fog / mist effect */
.fog {
  position: fixed;
  top: -20%;
  left: -20%;
  width: 140%;
  height: 140%;
  background: radial-gradient(rgba(255,255,255,0.02), transparent 70%);
  animation: fogMove 60s linear infinite;
  pointer-events: none;
}

@keyframes fogMove {
  from { transform: translateX(-10%) translateY(0); }
  to { transform: translateX(10%) translateY(0); }
}

/* Twinkling haunted lights */
.star {
  position: fixed;
  color: #ffcc00;
  font-size: 6px;
  opacity: 0.5;
  animation: twinkle ease-in-out infinite;
  pointer-events: none;
}

@keyframes twinkle {
  0%, 100% { opacity: 0.2; }
  50% { opacity: 1; }
}

button {
  padding: 12px 25px;
  font-size: 18px;
  border-radius: 20px;
  border: none;
  cursor: pointer;
  background-color: #330033;
  color: #ffcc00;
}

nav a {
  color: #ffcc00;
  margin: 10px;
  text-decoration: none;
}
.bat, .ghost {
  position: fixed;
  top: -50px;  /* start above the screen */
  font-size: 24px;
  pointer-events: none;
  animation: float linear infinite;
}

.bat {
  color: black;
}

.ghost {
  color: white;
  opacity: 0.8;
}

/* Floating animation */
@keyframes float {
  from {
    transform: translateY(-10px);
  }
  to {
    transform: translateY(110vh);
  }
}

  </style>
</head>
<body>

  <!-- Background / Visual elements -->
  <!-- Content -->
  <div class="fog"></div>

<h1>🎃 Haunted Halloween 🎃</h1>
<p id="message">Click the button for a spooky message!</p>
<button onclick="spookyMessage()">👻 Trick or Treat</button>

<nav>
  <a href="index.html">❄️ Winter</a> |
  <a href="summer.html">☀️ Summer</a>
</nav>

  <!-- JavaScript -->
  <script>
    // JS goes here
    function spookyMessage() {
  const messages = [
    "Boo! 🎃 Happy Halloween!",
    "👻 Trick or Treat!",
    "Stay spooky tonight! 🕷️",
    "Watch out for ghosts! 👀"
  ];
  const msg = messages[Math.floor(Math.random() * messages.length)];
  document.getElementById("message").textContent = msg;
}

// Create twinkling lights
for (let i = 0; i < 50; i++) {
  const star = document.createElement("div");
  star.className = "star";
  star.textContent = "✦";
  star.style.left = Math.random() * 100 + "vw";
  star.style.top = Math.random() * 100 + "vh";
  star.style.animationDuration = Math.random() * 3 + 2 + "s";
  star.style.fontSize = Math.random() * 6 + 4 + "px";
  document.body.appendChild(star);
}
// Create floating bats
for (let i = 0; i < 15; i++) {
  const bat = document.createElement("div");
  bat.className = "bat";
  bat.textContent = "🦇";
  bat.style.left = Math.random() * 100 + "vw";
  bat.style.animationDuration = Math.random() * 8 + 6 + "s"; // random speed
  bat.style.fontSize = Math.random() * 30 + 20 + "px"; // random size
  document.body.appendChild(bat);
}

// Create floating ghosts
for (let i = 0; i < 10; i++) {
  const ghost = document.createElement("div");
  ghost.className = "ghost";
  ghost.textContent = "👻";
  ghost.style.left = Math.random() * 100 + "vw";
  ghost.style.animationDuration = Math.random() * 12 + 8 + "s"; // random speed
  ghost.style.fontSize = Math.random() * 40 + 30 + "px"; // random size
  document.body.appendChild(ghost);
}

  </script>
</body>
</html>
